services:
  mongodb:
    image: mongo:7.0
    container_name: lifemanager_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
    container_name: lifemanager_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules # Захищаємо Linux модулі від перезапису
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemanager
      - JWT_SECRET=SuperSecretLifeManagerKey2026_!@#
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: lifemanager_frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data: